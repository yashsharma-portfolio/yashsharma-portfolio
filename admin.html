
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yash Sharma | Admin Login</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #101114;
      color: #ffffff;
    }

    .login-card {
      width: 100%;
      max-width: 400px;
      padding: 30px;
      background: #1c1d22;
      border: 1px solid #393a42;
      border-radius: 16px;
    }

    h1 { margin-top: 0; font-size: 25px; }
    p { color: #b8bac4; line-height: 1.5; }

    input, button {
      width: 100%;
      padding: 13px;
      margin-top: 12px;
      border-radius: 8px;
      font-size: 15px;
    }

    input {
      background: #101114;
      border: 1px solid #444650;
      color: white;
    }

    button {
      background: #d7ff45;
      border: 0;
      color: #111111;
      font-weight: bold;
      cursor: pointer;
    }

    #message {
      overflow-wrap: anywhere;
      font-size: 14px;
    }

    a { color: #d7ff45; }
  </style>
</head>

<body>
  <main class="login-card">
    <h1>Admin Login</h1>
    <p>Sign in with your authorized portfolio administrator account.</p>

    <form id="loginForm">
      <input
        id="email"
        type="email"
        placeholder="Admin email"
        autocomplete="username"
        required
      >

      <input
        id="password"
        type="password"
        placeholder="Password"
        autocomplete="current-password"
        required
      >

      <button type="submit" id="loginButton">Sign In</button>
    </form>

    <p id="message" role="status"></p>
    <p><a href="./index.html">Back to portfolio</a></p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL = "https://gipjluebbykqljrgihum.supabase.co";
    const SUPABASE_KEY = "sb_publishable_44cpC8_6M4aiFvmOllZrRA_p9XLnwPC";
    const ADMIN_USER_ID = "c634c54b-acbf-4a34-b069-244967a8f754";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const form = document.getElementById("loginForm");
    const message = document.getElementById("message");
    const button = document.getElementById("loginButton");

    form.addEventListener("submit", async function (event) {
      event.preventDefault();

      button.disabled = true;
      message.textContent = "Signing in...";

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      const { data, error } = await supabaseClient.auth.signInWithPassword({
        email,
        password
      });

      if (error) {
        message.textContent = "Login failed: " + error.message;
        button.disabled = false;
        return;
      }

      if (data.user.id !== ADMIN_USER_ID) {
        await supabaseClient.auth.signOut();
        message.textContent = "Access denied. This account is not authorized.";
        button.disabled = false;
        return;
      }

      message.textContent = "Login successful. Opening portfolio...";
      window.location.href = "./index.html";
    });
  </script>
</body>
</html>
